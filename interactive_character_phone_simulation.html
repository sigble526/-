<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>캐릭터 스마트폰 몰래보기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* iOS 폰트 및 스크롤바 모션 스타일링 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        
        /* 커스텀 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* iOS 통화화면 그라디언트 효과 */
        .call-bg {
            background: linear-gradient(180deg, #3d3132 0%, #1c191a 100%);
        }

        /* 펄스 애니메이션 (전화 수신 시) */
        @keyframes ring-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 0.4; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .animate-ring {
            animation: ring-pulse 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex items-center justify-center p-0 sm:p-4 overflow-hidden">

    <!-- 스마트폰 컨테이너 (모바일 및 데스크톱 모의 프레임) -->
    <div class="relative w-full max-w-[412px] h-[100dvh] sm:h-[847px] bg-black sm:rounded-[50px] sm:border-[8px] sm:border-zinc-800 shadow-2xl flex flex-col overflow-hidden relative border-box">

        <!-- iOS 노치 / 다이내믹 아일랜드 -->
        <div class="absolute top-2 left-1/2 -translate-x-1/2 w-28 h-6 bg-black rounded-full z-50 flex items-center justify-end px-2 gap-1.5 pointer-events-none">
            <div class="w-2.5 h-2.5 rounded-full bg-zinc-900 border border-zinc-800"></div>
            <div class="w-2 h-2 rounded-full bg-blue-900/40"></div>
        </div>

        <!-- iOS 상단 상태바 (Status Bar) -->
        <div class="w-full px-7 pt-3 pb-1 flex justify-between items-center text-xs font-semibold text-white z-40 select-none">
            <span id="status-time">14:00</span>
            <div class="flex items-center gap-1.5">
                <i data-lucide="signal" class="w-3.5 h-3.5"></i>
                <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
                <i data-lucide="battery" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- ================= 화면 1: 잠금 화면 (IMAGE 1 디자인 반영) ================= -->
        <div id="screen-lock" class="absolute inset-0 z-30 bg-black flex flex-col justify-between pt-16 pb-8 px-6 transition-all duration-500">
            <!-- 상단 시계 & 날짜 -->
            <div class="flex flex-col items-center mt-12">
                <span id="lock-date" class="text-zinc-300 text-sm font-medium mb-1">10월 27일 화요일</span>
                <h1 id="lock-time" class="text-7xl font-serif tracking-tight text-white font-normal">14:00</h1>
            </div>

            <!-- 하단 잠금 해제 버튼 및 플래시/카메라 -->
            <div class="flex flex-col items-center gap-12 mb-4">
                <div class="text-center">
                    <p class="text-zinc-400 text-xs mb-3 font-light">휴대전화를 열려면 잠금 해제</p>
                    <button onclick="unlockPhone()" class="bg-zinc-800/80 hover:bg-zinc-700/80 active:scale-95 transition text-white text-xs px-6 py-2.5 rounded-full border border-zinc-700/50 backdrop-blur-md">
                        잠금 해제
                    </button>
                </div>

                <div class="w-full flex justify-between items-center px-4">
                    <button class="w-11 h-11 rounded-full bg-zinc-900/80 border border-zinc-800 flex items-center justify-center text-white active:bg-zinc-700">
                        <i data-lucide="flashlight" class="w-5 h-5"></i>
                    </button>
                    <button class="w-11 h-11 rounded-full bg-zinc-900/80 border border-zinc-800 flex items-center justify-center text-white active:bg-zinc-700">
                        <i data-lucide="camera" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= 화면 2: 홈 화면 (앱 메뉴) ================= -->
        <div id="screen-home" class="hidden absolute inset-0 z-20 bg-zinc-950 flex flex-col justify-between pt-14 pb-6 px-6">
            <!-- 앱 그리드 -->
            <div class="grid grid-cols-4 gap-y-7 gap-x-4 pt-4">
                <!-- 메시지 앱 -->
                <button onclick="openApp('chat')" class="flex flex-col items-center gap-1 group">
                    <div class="w-14 h-14 bg-green-500 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-90 transition">
                        <i data-lucide="message-circle" class="w-8 h-8 text-white fill-white"></i>
                    </div>
                    <span class="text-[11px] text-zinc-300">메시지</span>
                </button>

                <!-- 전화 앱 -->
                <button onclick="triggerCall('incoming')" class="flex flex-col items-center gap-1 group">
                    <div class="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-90 transition">
                        <i data-lucide="phone" class="w-7 h-7 text-white fill-white"></i>
                    </div>
                    <span class="text-[11px] text-zinc-300">전화받기</span>
                </button>

                <!-- 갤러리 앱 -->
                <button onclick="openApp('gallery')" class="flex flex-col items-center gap-1 group">
                    <div class="w-14 h-14 bg-gradient-to-tr from-amber-400 via-rose-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-90 transition">
                        <i data-lucide="image" class="w-7 h-7 text-white"></i>
                    </div>
                    <span class="text-[11px] text-zinc-300">사진첩</span>
                </button>

                <!-- 메모장 앱 -->
                <button onclick="openApp('notes')" class="flex flex-col items-center gap-1 group">
                    <div class="w-14 h-14 bg-amber-100 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-90 transition">
                        <i data-lucide="notebook" class="w-7 h-7 text-amber-900"></i>
                    </div>
                    <span class="text-[11px] text-zinc-300">비밀메모</span>
                </button>

                <!-- 자캐 커스텀 설정 앱 ⭐ -->
                <button onclick="openApp('settings')" class="flex flex-col items-center gap-1 group">
                    <div class="w-14 h-14 bg-zinc-700 rounded-2xl flex items-center justify-center shadow-lg group-active:scale-90 transition">
                        <i data-lucide="settings" class="w-7 h-7 text-zinc-200"></i>
                    </div>
                    <span class="text-[11px] text-zinc-300">자캐 수정</span>
                </button>
            </div>

            <!-- 하단 고정 독(Dock) -->
            <div class="bg-zinc-900/60 backdrop-blur-xl border border-zinc-800/50 rounded-3xl p-3 flex justify-around items-center">
                <button onclick="openApp('chat')" class="w-12 h-12 bg-green-500 rounded-xl flex items-center justify-center active:scale-95 transition">
                    <i data-lucide="message-circle" class="w-6 h-6 text-white fill-white"></i>
                </button>
                <button onclick="triggerCall('outgoing')" class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center active:scale-95 transition">
                    <i data-lucide="phone-call" class="w-6 h-6 text-white"></i>
                </button>
                <button onclick="openApp('settings')" class="w-12 h-12 bg-zinc-800 rounded-xl flex items-center justify-center active:scale-95 transition">
                    <i data-lucide="sliders" class="w-6 h-6 text-zinc-300"></i>
                </button>
            </div>
        </div>

        <!-- ================= 앱 1: 메시지 (채팅) 화면 ================= -->
        <div id="app-chat" class="hidden absolute inset-0 z-20 bg-black flex flex-col justify-between pt-12">
            <!-- 채팅 헤더 -->
            <div class="bg-zinc-900/90 backdrop-blur border-b border-zinc-800 px-4 py-2.5 flex items-center justify-between">
                <button onclick="goHome()" class="flex items-center text-blue-400 text-sm">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i> 목록
                </button>
                <div class="flex flex-col items-center">
                    <img id="chat-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" class="w-7 h-7 rounded-full object-cover mb-0.5">
                    <span id="chat-char-name" class="text-xs font-semibold text-zinc-100">문대 씨</span>
                </div>
                <button onclick="triggerCall('outgoing')" class="text-blue-400 p-1">
                    <i data-lucide="phone" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- 대화 메시지 영역 -->
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar">
                <!-- JS로 자동 생성됨 -->
            </div>

            <!-- 메시지 입력창 및 전화 걸기 특수 버튼 -->
            <div class="bg-zinc-900 border-t border-zinc-800 p-2.5 flex items-center gap-2">
                <button onclick="triggerCall('incoming')" class="text-rose-500 p-1.5 rounded-full hover:bg-zinc-800" title="캐릭터에게 전화 오게 하기">
                    <i data-lucide="phone-incoming" class="w-5 h-5"></i>
                </button>
                <input id="chat-input" type="text" placeholder="메시지 보내기..." class="flex-1 bg-zinc-800 text-sm text-white px-4 py-2 rounded-full focus:outline-none focus:ring-1 focus:ring-blue-500">
                <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-full active:scale-95 transition">
                    <i data-lucide="arrow-up" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- ================= 앱 2: 통화/수신 화면 (IMAGE 2 디자인 반영) ================= -->
        <!-- 수신 대기 화면 (전화 걸려올 때) -->
        <div id="app-incoming-call" class="hidden absolute inset-0 z-40 call-bg flex flex-col justify-between py-16 px-8 text-center">
            <div class="mt-8 flex flex-col items-center">
                <div class="relative mb-4">
                    <div class="absolute -inset-3 rounded-full bg-white/10 animate-ring"></div>
                    <img id="incoming-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=faces" class="w-24 h-24 rounded-full object-cover border-2 border-white/20 relative z-10">
                </div>
                <p class="text-zinc-400 text-sm">휴대전화 걸려오는 중...</p>
                <h2 id="incoming-char-name" class="text-3xl font-bold text-white mt-1">문대 씨</h2>
            </div>

            <div class="flex justify-around items-center px-6">
                <!-- 거절 버튼 -->
                <button onclick="endCall()" class="flex flex-col items-center gap-2">
                    <div class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center text-white active:scale-90 transition shadow-lg">
                        <i data-lucide="phone-off" class="w-7 h-7"></i>
                    </div>
                    <span class="text-xs text-zinc-300">거절</span>
                </button>

                <!-- 응답 버튼 -->
                <button onclick="acceptCall()" class="flex flex-col items-center gap-2">
                    <div class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center text-white active:scale-90 transition shadow-lg animate-bounce">
                        <i data-lucide="phone" class="w-7 h-7 fill-white"></i>
                    </div>
                    <span class="text-xs text-zinc-300">응답</span>
                </button>
            </div>
        </div>

        <!-- 통화 중 화면 (이미지 2의 iOS 인터페이스 구현) -->
        <div id="app-incall" class="hidden absolute inset-0 z-40 call-bg flex flex-col justify-between py-12 px-6 text-center">
            <!-- 상단 캐릭터 정보 -->
            <div class="mt-6 flex flex-col items-center">
                <div class="w-20 h-20 rounded-full bg-zinc-600 overflow-hidden mb-3 border border-white/10 shadow-inner flex items-center justify-center">
                    <img id="incall-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=faces" class="w-full h-full object-cover">
                </div>
                <p id="incall-status" class="text-zinc-400 text-xs font-light">휴대전화 연결 중...</p>
                <h2 id="incall-char-name" class="text-3xl font-semibold text-white mt-1">문대 씨</h2>
            </div>

            <!-- 통화 대화 자막 표시 영역 -->
            <div id="call-subtitle" class="bg-black/40 backdrop-blur border border-white/10 rounded-2xl p-4 text-sm text-zinc-200 my-auto min-h-[80px] flex items-center justify-center">
                "여보세요...? 전화했어?"
            </div>

            <!-- 하단 6개 통화 기능 아이콘 (이미지 2 원본과 동일) -->
            <div class="grid grid-cols-3 gap-y-6 gap-x-4 px-2 mb-4">
                <!-- 스피커 -->
                <button class="flex flex-col items-center gap-1.5 group">
                    <div class="w-16 h-16 bg-zinc-700/60 rounded-full flex items-center justify-center text-white group-active:bg-zinc-600">
                        <i data-lucide="volume-2" class="w-7 h-7"></i>
                    </div>
                    <span class="text-xs text-zinc-300">스피커</span>
                </button>

                <!-- FaceTime -->
                <button class="flex flex-col items-center gap-1.5 group">
                    <div class="w-16 h-16 bg-zinc-700/60 rounded-full flex items-center justify-center text-white group-active:bg-zinc-600">
                        <i data-lucide="video" class="w-7 h-7"></i>
                    </div>
                    <span class="text-xs text-zinc-300">FaceTime</span>
                </button>

                <!-- 소리 끔 -->
                <button class="flex flex-col items-center gap-1.5 group">
                    <div class="w-16 h-16 bg-zinc-700/60 rounded-full flex items-center justify-center text-white group-active:bg-zinc-600">
                        <i data-lucide="mic-off" class="w-7 h-7"></i>
                    </div>
                    <span class="text-xs text-zinc-300">소리 끔</span>
                </button>

                <!-- 추가 -->
                <button class="flex flex-col items-center gap-1.5 group">
                    <div class="w-16 h-16 bg-zinc-700/60 rounded-full flex items-center justify-center text-white group-active:bg-zinc-600">
                        <i data-lucide="user-plus" class="w-7 h-7"></i>
                    </div>
                    <span class="text-xs text-zinc-300">추가</span>
                </button>

                <!-- 종료 (빨간색 버튼) -->
                <button onclick="endCall()" class="flex flex-col items-center gap-1.5">
                    <div class="w-16 h-16 bg-red-600 rounded-full flex items-center justify-center text-white active:scale-95 transition shadow-lg">
                        <i data-lucide="phone-off" class="w-7 h-7"></i>
                    </div>
                    <span class="text-xs text-zinc-300">종료</span>
                </button>

                <!-- 키패드 -->
                <button class="flex flex-col items-center gap-1.5 group">
                    <div class="w-16 h-16 bg-zinc-700/60 rounded-full flex items-center justify-center text-white group-active:bg-zinc-600">
                        <i data-lucide="grip" class="w-7 h-7"></i>
                    </div>
                    <span class="text-xs text-zinc-300">키패드</span>
                </button>
            </div>
        </div>

        <!-- ================= 앱 3: 갤러리 (사진첩) ================= -->
        <div id="app-gallery" class="hidden absolute inset-0 z-20 bg-black flex flex-col pt-12">
            <div class="px-4 py-3 border-b border-zinc-800 flex justify-between items-center">
                <button onclick="goHome()" class="text-blue-400 text-sm flex items-center">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> 홈
                </button>
                <h3 class="text-sm font-semibold">비밀 갤러리</h3>
                <div class="w-8"></div>
            </div>
            <div class="grid grid-cols-2 gap-2 p-3 overflow-y-auto no-scrollbar">
                <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&fit=crop" class="w-full h-36 object-cover rounded-lg border border-zinc-800">
                <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400&fit=crop" class="w-full h-36 object-cover rounded-lg border border-zinc-800">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&fit=crop" class="w-full h-36 object-cover rounded-lg border border-zinc-800">
            </div>
        </div>

        <!-- ================= 앱 4: 비밀 메모장 ================= -->
        <div id="app-notes" class="hidden absolute inset-0 z-20 bg-black flex flex-col pt-12">
            <div class="px-4 py-3 border-b border-zinc-800 flex justify-between items-center">
                <button onclick="goHome()" class="text-blue-400 text-sm flex items-center">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> 홈
                </button>
                <h3 class="text-sm font-semibold">비밀 일기장</h3>
                <div class="w-8"></div>
            </div>
            <div class="p-4 overflow-y-auto text-sm space-y-3 text-zinc-300">
                <div class="bg-zinc-900 p-3 rounded-xl border border-zinc-800">
                    <p class="text-xs text-amber-500 font-semibold mb-1">2026.10.25</p>
                    <p id="note-content-1">오늘 아무에게도 말하지 못한 일이 생겼다. 그 사람에게 연락해볼까...</p>
                </div>
            </div>
        </div>

        <!-- ================= 앱 5: 자캐 커스텀 설정 (사용자가 직접 수정 가능! ⭐) ================= -->
        <div id="app-settings" class="hidden absolute inset-0 z-20 bg-zinc-900 flex flex-col pt-12">
            <div class="px-4 py-3 border-b border-zinc-800 flex justify-between items-center">
                <button onclick="goHome()" class="text-blue-400 text-sm flex items-center">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> 홈
                </button>
                <h3 class="text-sm font-semibold text-white">자작캐릭터 커스텀 설정</h3>
                <button onclick="saveSettings()" class="text-blue-400 font-semibold text-xs">저장</button>
            </div>
            
            <div class="p-4 overflow-y-auto space-y-4 text-xs text-zinc-300">
                <div>
                    <label class="block mb-1 font-semibold text-zinc-400">캐릭터 이름</label>
                    <input id="setting-name" type="text" class="w-full bg-zinc-800 p-2.5 rounded-lg border border-zinc-700 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block mb-1 font-semibold text-zinc-400">프로필 이미지 URL</label>
                    <input id="setting-avatar" type="text" class="w-full bg-zinc-800 p-2.5 rounded-lg border border-zinc-700 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block mb-1 font-semibold text-zinc-400">전화 연결 시 첫 대사 자막</label>
                    <input id="setting-dialogue" type="text" class="w-full bg-zinc-800 p-2.5 rounded-lg border border-zinc-700 text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block mb-1 font-semibold text-zinc-400">비밀 메모장 내용</label>
                    <textarea id="setting-note" rows="3" class="w-full bg-zinc-800 p-2.5 rounded-lg border border-zinc-700 text-white focus:outline-none focus:border-blue-500"></textarea>
                </div>

                <div class="bg-zinc-800/60 p-3 rounded-lg border border-zinc-700/50">
                    <p class="text-amber-400 font-semibold mb-1">💡 사용 팁</p>
                    <p class="text-[11px] leading-relaxed text-zinc-400">
                        • 설정 후 [저장]을 누르면 즉시 캐릭터가 반영됩니다.<br>
                        • 채팅창 왼쪽 하단 📞 아이콘을 누르면 2초 뒤 캐릭터에게 전화가 옵니다!
                    </p>
                </div>
            </div>
        </div>

        <!-- iOS 하단 홈바 Indicator -->
        <div onclick="goHome()" class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-white/40 rounded-full z-50 cursor-pointer active:bg-white/80"></div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        // 기본 캐릭터 상태 데이터 (로컬 스토리지에 자동 저장됨)
        let characterData = {
            name: "문대 씨",
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop&crop=faces",
            callDialogue: "여보세요...? 지금 전화할 수 있어?",
            note: "오늘 아무에게도 말하지 못한 일이 생겼다. 그 사람에게 연락해볼까..."
        };

        // 초기 채팅 데이터
        let chatMessages = [
            { sender: "char", text: "혹시 지금 바빠?" },
            { sender: "char", text: "시간 되면 잠깐 전화 가능해?" }
        ];

        // 페이지 로드 시 초기화
        window.onload = function() {
            lucide.createIcons();
            loadSettings();
            renderChat();
            updateClock();
            setInterval(updateClock, 1000);
        };

        // 시계 업데이트
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const timeStr = `${hours}:${minutes}`;
            
            document.getElementById('status-time').innerText = timeStr;
            document.getElementById('lock-time').innerText = timeStr;
        }

        // 잠금 해제
        function unlockPhone() {
            document.getElementById('screen-lock').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }

        // 앱 열기
        function openApp(appName) {
            hideAllScreens();
            document.getElementById(`app-${appName}`).classList.remove('hidden');
        }

        // 홈 화면으로 이동
        function goHome() {
            hideAllScreens();
            document.getElementById('screen-home').classList.remove('hidden');
        }

        function hideAllScreens() {
            document.getElementById('screen-lock').classList.add('hidden');
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('app-chat').classList.add('hidden');
            document.getElementById('app-incoming-call').classList.add('hidden');
            document.getElementById('app-incall').classList.add('hidden');
            document.getElementById('app-gallery').classList.add('hidden');
            document.getElementById('app-notes').classList.add('hidden');
            document.getElementById('app-settings').classList.add('hidden');
        }

        // 채팅 메시지 렌더링
        function renderChat() {
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            
            chatMessages.forEach(msg => {
                const isUser = msg.sender === 'user';
                const msgEl = document.createElement('div');
                msgEl.className = `flex ${isUser ? 'justify-end' : 'justify-start'} items-end gap-2`;
                
                if (isUser) {
                    msgEl.innerHTML = `
                        <div class="bg-blue-600 text-white text-xs px-3.5 py-2 rounded-2xl max-w-[70%] rounded-br-xs">
                            ${msg.text}
                        </div>
                    `;
                } else {
                    msgEl.innerHTML = `
                        <img src="${characterData.avatar}" class="w-6 h-6 rounded-full object-cover">
                        <div class="bg-zinc-800 text-zinc-100 text-xs px-3.5 py-2 rounded-2xl max-w-[70%] rounded-bl-xs">
                            ${msg.text}
                        </div>
                    `;
                }
                chatBox.appendChild(msgEl);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 메시지 전송
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            chatMessages.push({ sender: 'user', text: text });
            input.value = '';
            renderChat();

            // 캐릭터 자동 응답 시뮬레이션
            setTimeout(() => {
                chatMessages.push({ sender: 'char', text: '응, 알겠어. 곧 전화할게!' });
                renderChat();
                
                // 2.5초 후 자동으로 전화 걸려오는 이벤트 발생
                setTimeout(() => {
                    triggerCall('incoming');
                }, 2500);
            }, 1000);
        }

        // 전화 수신 / 발신 이벤트Trigger
        function triggerCall(type) {
            hideAllScreens();
            if (type === 'incoming') {
                document.getElementById('app-incoming-call').classList.remove('hidden');
            } else {
                acceptCall();
            }
        }

        // 전화 응답
        function acceptCall() {
            hideAllScreens();
            document.getElementById('app-incall').classList.remove('hidden');
            
            // 통화 시간 카운터 시뮬레이션
            let sec = 0;
            const statusEl = document.getElementById('incall-status');
            statusEl.innerText = "00:00";
            
            window.callTimer = setInterval(() => {
                sec++;
                const m = String(Math.floor(sec / 60)).padStart(2, '0');
                const s = String(sec % 60).padStart(2, '0');
                statusEl.innerText = `${m}:${s}`;
            }, 1000);
        }

        // 통화 종료
        function endCall() {
            if (window.callTimer) clearInterval(window.callTimer);
            goHome();
        }

        // 설정 불러오기 및 반영
        function loadSettings() {
            const saved = localStorage.getItem('char_phone_data');
            if (saved) {
                characterData = JSON.parse(saved);
            }

            document.getElementById('setting-name').value = characterData.name;
            document.getElementById('setting-avatar').value = characterData.avatar;
            document.getElementById('setting-dialogue').value = characterData.callDialogue;
            document.getElementById('setting-note').value = characterData.note;

            applyCharacterData();
        }

        // 설정 저장하기
        function saveSettings() {
            characterData.name = document.getElementById('setting-name').value;
            characterData.avatar = document.getElementById('setting-avatar').value;
            characterData.callDialogue = document.getElementById('setting-dialogue').value;
            characterData.note = document.getElementById('setting-note').value;

            localStorage.setItem('char_phone_data', JSON.stringify(characterData));
            applyCharacterData();
            alert('자작캐릭터 설정이 저장되었습니다!');
            goHome();
        }

        // UI에 캐릭터 데이터 업데이트
        function applyCharacterData() {
            // 이름 적용
            document.getElementById('chat-char-name').innerText = characterData.name;
            document.getElementById('incoming-char-name').innerText = characterData.name;
            document.getElementById('incall-char-name').innerText = characterData.name;

            // 아바타 적용
            document.getElementById('chat-avatar').src = characterData.avatar;
            document.getElementById('incoming-avatar').src = characterData.avatar;
            document.getElementById('incall-avatar').src = characterData.avatar;

            // 통화 대사 적용
            document.getElementById('call-subtitle').innerText = `"${characterData.callDialogue}"`;

            // 메모장 적용
            document.getElementById('note-content-1').innerText = characterData.note;

            renderChat();
        }
    </script>
</body>
</html>
